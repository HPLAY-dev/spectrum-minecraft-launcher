<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Spectrum-Minecraft-Launcher</title>
<link rel="stylesheet" href="fonts.css" />

<style>
@import url("fonts.css");

/* ===== 基础风格 ===== */
body {
    margin: 0;
    font-family: var(--font-cn-body);
    font-weight: var(--weight-cn-body);
    background: var(--light);
    color: var(--sage);
    display: flex;
    height: 100vh;
    overflow: hidden;
}

/* ===== 左侧导航 ===== */
.sidebar {
    width: 220px;
    background: var(--light);
    border-right: 1px solid var(--gray);
    padding: 30px 20px;
    box-sizing: border-box;
}

.logo {
    font-family: var(--font-en-title);
    font-weight: var(--weight-en-title);
    font-size: 13px;
    line-height: 1.4;
    letter-spacing: 0.04em;
    color: var(--sage);
    margin-bottom: 40px;
}

.nav-item {
    font-family: var(--font-cn-body);
    font-weight: var(--weight-cn-body);
    padding: 10px 12px;
    margin-bottom: 10px;
    background: var(--gray);
    clip-path: polygon(6px 0, 100% 0, 100% calc(100% - 6px), calc(100% - 6px) 100%, 0 100%, 0 6px);
    cursor: pointer;
    transition: 0.2s;
}

.nav-item:hover {
    background: var(--sage-light);
}

/* ===== 主区域 ===== */
.main {
    flex: 1;
    padding: 40px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
}

/* 顶部信息 */
.topbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.title {
    font-family: var(--font-cn-title);
    font-weight: var(--weight-cn-title);
    font-size: 22px;
    color: var(--sage);
    letter-spacing: 0.05em;
}

/* 启动按钮 */
.play-btn {
    font-family: var(--font-cn-body);
    width: 180px;
    height: 55px;
    background: var(--sage);
    border: 1px solid var(--sage);
    color: var(--light);
    font-size: 16px;
    cursor: pointer;

    clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px),
                        calc(100% - 10px) 100%, 0 100%, 0 10px);

    transition: 0.2s;
}

.play-btn:hover {
    background: #6a6f62;
}

/* 下方信息卡片 */
.panel {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
}

.card {
    background: var(--light);
    border: 1px solid var(--gray);
    padding: 20px;
    min-height: 120px;

    clip-path: polygon(8px 0, 100% 0, 100% calc(100% - 8px),
                        calc(100% - 8px) 100%, 0 100%, 0 8px);
}

.card h3 {
    margin: 0 0 10px 0;
    font-family: var(--font-cn-title);
    font-weight: var(--weight-cn-title);
    font-size: 14px;
    color: var(--sage);
}

.card p {
    font-family: var(--font-cn-body);
    font-size: 13px;
    color: var(--sage-light);
    line-height: 1.6;
}

/* 版本选择 */
.version {
    margin-top: 10px;
    font-size: 13px;
    color: var(--sage-light);
}

select {
    font-family: var(--font-cn-body);
    width: 100%;
    margin-top: 8px;
    padding: 8px;
    border: 1px solid var(--gray);
    background: var(--light);
    color: var(--sage);
    outline: none;

    clip-path: polygon(6px 0, 100% 0, 100% calc(100% - 6px),
                        calc(100% - 6px) 100%, 0 100%, 0 6px);
}
</style>
</head>

<body>

<!-- 左侧栏 -->
<div class="sidebar">
    <div class="logo">Spectrum-Minecraft-Launcher</div>

    <div class="nav-item">启动</div>
    <div class="nav-item">版本管理</div>
    <div class="nav-item">模组</div>
    <div class="nav-item">设置</div>
</div>

<!-- 主界面 -->
<div class="main">

    <div class="topbar">
        <div class="title">启动器主页</div>
        <button class="play-btn">▶ 启动游戏</button>
    </div>

    <div class="panel">

        <div class="card">
            <h3>当前配置</h3>
            <p>选择 Minecraft 版本与运行环境，保持轻量化启动配置。</p>

            <div class="version">
                版本选择
                <select>
                    <option>1.20.4（稳定）</option>
                    <option>1.19.2</option>
                    <option>1.18.2</option>
                    <option>最新快照</option>
                </select>
            </div>
        </div>

        <div class="card">
            <h3>状态信息</h3>
            <p>
                Java：已检测<br/>
                内存：4GB 分配<br/>
                光影：关闭<br/>
                模组：0
            </p>
        </div>

    </div>

</div>

</body>
</html>
