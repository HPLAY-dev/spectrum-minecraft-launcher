[project]
name = "serena-launcher"
version = "26.2.0"
description = "SerenaLauncher — cross-platform Minecraft launcher (codename Okra)"
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.6",
    "requests>=2.31",
]

[project.scripts]
serena-launcher = "main_qml:main"

[tool.setuptools.packages.find]
where = ["src/core/GUI/py"]
